name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Download portfolio
        run: |
          mkdir -p _site
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=_site \
            'https://milena-design-portfolio.phongtaolaobidao094.chatgpt.site/'
          printf '\nhtml { scroll-behavior: auto !important; }\n' >> _site/assets/index-Csf9j4XZ.css
          printf '%s\n' 'document.addEventListener("click",function(e){const a=e.target.closest("a[href^=\"#\"]");if(!a)return;const h=a.getAttribute("href"),s=h&&h!=="#"&&document.querySelector(h);if(!s)return;e.preventDefault();e.stopPropagation();s.scrollIntoView({behavior:"auto",block:"start"});history.replaceState(null,"",location.pathname+location.search)},true);' > _site/navigation-fix.js
          sed -i 's#</body>#<script src="/navigation-fix.js"></script></body>#' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
